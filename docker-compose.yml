version: '3.8'

services:
  # 1. データベースコンテナ（backend-net のみ）
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutoring_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net # ◄ DBはバックエンドネットワークのみ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Djangoアプリコンテナ（両方のネットワークに参加）
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - frontend-net # ◄ Nginxからの通信用
      - backend-net  # ◄ DBへの通信用
    depends_on:
      db:
        condition: service_healthy

  # 3. Nginxコンテナ（frontend-net のみ）
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    networks:
      - frontend-net # ◄ フロントエンドネットワークのみ
    depends_on:
      - app

# データ永続化・共有ボリューム
volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_var:

# ネットワークの定義（新規追加）
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge