upstream django_app {
    server app:8000;
}

# 1. HTTP（80番）アクセスをすべてHTTPS（443番）へ強制リダイレクト
server {
    listen 80;
    server_name tutor-matching.com; # 取得したドメイン名

    # Let's Encrypt の証明書発行・更新時の検証用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS（443番）設定
server {
    listen 443 ssl;
    server_name tutor-matching.com; # 取得したドメイン名

    # SSL証明書と秘密鍵のパス（Let's Encryptの配置場所）
    ssl_certificate /etc/letsencrypt/live/tutor-matching.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutor-matching.com/privkey.pem;

    # SSLセキュリティ基本設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # WebSocketプロキシ
    location /ws/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 通常HTTPプロキシ
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}